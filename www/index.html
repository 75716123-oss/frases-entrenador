<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<title>Frases Entrenador v1.0.1</title>
<style>
:root{--bg:#0B0B0B;--card:#151515;--edge:#262626;--edge2:#0a0a0a;--lime:#C8FF00;--limed:#86a800;--gold:#E3B23C;--teal:#3DDC97;--red:#FF5C5C;--tx:#F4F4F4;--mut:#9A9A9A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;display:flex;flex-direction:column}
#top{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:2px solid var(--edge)}
#top .logo{font-weight:900;color:var(--lime);letter-spacing:.5px;font-size:17px}
#top .logo small{color:var(--mut);font-weight:600;font-size:11px;margin-left:5px}
.pills{display:flex;gap:8px}
.pill{background:var(--card);border:2px solid var(--edge);border-radius:20px;padding:4px 10px;font-weight:800;font-size:14px}
#view{flex:1;overflow-y:auto;padding:14px 14px 20px}
#nav{flex:none;display:flex;background:#101010;border-top:2px solid var(--edge);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#nav button{flex:1;background:none;border:2px solid transparent;border-radius:14px;color:var(--mut);padding:6px 2px;font-size:10.5px;font-weight:700}
#nav button span{display:block;font-size:21px;line-height:1.2}
#nav button.on{color:var(--lime);background:#1a1f08;border-color:#3b4a0c}
h2{margin:4px 0 4px;font-size:22px;font-weight:900}
.sub{color:var(--mut);font-size:13.5px;margin-bottom:12px;line-height:1.4}
.bar{height:14px;background:var(--card);border:2px solid var(--edge);border-radius:10px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--lime);border-radius:8px;transition:width .3s}
.card{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--edge);border-bottom-width:5px;border-radius:18px;padding:10px 10px 10px 10px;margin-bottom:10px}
.card.done{border-color:#3b4a0c;background:#14180a}
.spk{flex:none;width:46px;height:46px;border-radius:14px;background:var(--lime);color:#111;border:0;border-bottom:4px solid var(--limed);font-size:20px}
.spk:active{transform:translateY(2px);border-bottom-width:2px}
.tx{flex:1;min-width:0}
.en{font-weight:800;font-size:calc(16.5px*var(--z,1));line-height:1.25}
.pr{color:var(--lime);font-style:italic;font-size:calc(13.5px*var(--z,1));margin-top:2px}
.es{color:var(--mut);font-size:calc(13px*var(--z,1));margin-top:2px}
.side{flex:none;display:flex;flex-direction:column;gap:6px}
.ic{width:38px;height:38px;border-radius:12px;background:#1c1c1c;border:2px solid var(--edge);border-bottom-width:4px;color:#666;font-size:17px}
.ic.on.heart{color:var(--red);border-color:#5a2020;background:#241212}
.ic.on.ok{color:var(--teal);border-color:#1d5a3f;background:#0f2219}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:14px;border:2px solid var(--edge);border-bottom-width:4px;background:var(--card);color:var(--mut);font-size:13px;font-weight:700}
.chip.on{background:var(--lime);color:#111;border-color:var(--limed)}
input,textarea{width:100%;padding:13px;border-radius:14px;border:2px solid var(--edge);background:var(--card);color:var(--tx);font-size:16px;font-family:inherit}
textarea{min-height:100px;resize:none}
input:focus,textarea:focus{outline:none;border-color:var(--lime)}
.btn{display:block;width:100%;padding:15px;border-radius:16px;border:2px solid var(--edge);border-bottom-width:5px;background:var(--card);color:var(--tx);font-size:16px;font-weight:800;text-align:left;margin-bottom:10px}
.btn.c{text-align:center}
.btn.p{background:var(--lime);color:#111;border-color:var(--limed);text-align:center}
.btn:active{transform:translateY(2px);border-bottom-width:3px}
.btn.ok{border-color:var(--teal);background:#0f2219}
.btn.no{border-color:var(--red);background:#2a1212}
.btn[disabled]{opacity:.55}
.q{font-size:21px;font-weight:900;margin:16px 0 4px;line-height:1.3}
.qh{color:var(--mut);font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.sheet{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-top-left-radius:22px;border-top-right-radius:22px;z-index:9}
.sheet.ok{background:#12301f;color:var(--teal)}
.sheet.no{background:#3a1616;color:var(--red)}
.sheet b{font-size:19px;display:block}
.sheet div{color:var(--tx);margin:6px 0 12px;font-size:15px}
.big{font-size:54px;text-align:center;margin:14px 0 0}
.res{background:var(--card);border:2px solid var(--edge);border-radius:18px;padding:14px;margin:12px 0}
.row{display:flex;gap:10px}
.row .btn{margin-bottom:0}
.empty{text-align:center;color:var(--mut);padding:34px 14px;line-height:1.5}
.small{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.4}
.zoombtn{position:fixed;right:12px;bottom:calc(82px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;background:#1c1c1c;border:2px solid var(--edge);color:var(--lime);font-weight:900;z-index:5}
</style></head><body>

</div>

 let h='<h2>Las 30 esenciales</h2><div class="sub">Las frases más usadas en el gimnasio. Toca 🔊 para escucharla y ✓ cuando ya la domines.</div><div class="bar"><i style="width:'+(n/ESS.length*100)+'%"></i></div><div class="sub" style="margin-top:-8px"><b style="color:var(--lime)">'+n+' / '+ESS.length+'</b> dominadas</div>';
 ESS.forEach(i=>h+=card(ALL[i],{learn:1}));
 h+='<button class="btn p" data-go="dic">📖 Ver las '+ALL.length+' frases del diccionario</button>';return h}
function viewDic(){
 let h='<h2>Diccionario</h2><div class="sub">'+ALL.length+' frases. Busca en inglés o español.</div><input id="qi" type="search" placeholder="Buscar... (ej. gracias, squat, peso)" value="'+esc(q)+'" autocomplete="off"><div class="chips" style="margin-top:10px">';
 ["Todas"].concat(DATA.map(c=>c.c)).forEach(c=>h+='<button class="chip'+(c===cat?" on":"")+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>');
 h+='</div><div id="dl">'+dicList()+'</div>';return h}
function dicList(){const nq=norm(q);let h="",n=0;
 DATA.forEach(c=>{if(cat!=="Todas"&&c.c!==cat)return;const ps=c.p.filter(p=>!nq||norm(p.en+" "+p.es+" "+p.pr).includes(nq));if(!ps.length)return;
  h+='<div class="qh" style="margin:12px 2px 8px">'+esc(c.c)+'</div>';ps.forEach(p=>{n++;h+=card(p)})});
 return n?h:'<div class="empty">No encontré esa frase. Prueba en el 🌐 Traductor.</div>'}
function viewFav(){const ids=Object.keys(S.likes).filter(k=>S.likes[k]).map(Number);
 let h='<h2>Me gusta</h2><div class="sub">Tus frases favoritas y traducciones guardadas. Toca ♡ en cualquier frase para guardarla aquí.</div>';
 if(!ids.length&&!S.saved.length)return h+'<div class="empty">❤️<br>Aún no tienes favoritas.<br>Toca el ♡ en una frase y aparecerá aquí.</div>';
 ids.forEach(i=>h+=card(ALL[i]));
 if(S.saved.length){h+='<div class="qh" style="margin:14px 2px 8px">Mis traducciones</div>';S.saved.forEach((s,k)=>{h+='<div class="card"><button class="spk" data-sayt="'+k+'">🔊</button><div class="tx"><div class="en">'+esc(s.en)+'</div><div class="es">'+esc(s.es)+'</div></div><div class="side"><button class="ic" data-del="'+k+'">🗑</button></div></div>'})}
 return h}
function pool(all){return all?ALL.slice():ESS.map(i=>ALL[i])}
function newPractice(all){const pl=pool(all).slice().sort(()=>Math.random()-.5).slice(0,10);
 const qs=pl.map(p=>{const bad=ALL.filter(x=>x.id!==p.id&&x.en!==p.en).sort(()=>Math.random()-.5).slice(0,3);return{p:p,opts:bad.concat([p]).sort(()=>Math.random()-.5)}});
 P={qs:qs,i:0,ok:0,xp:0,done:false,sel:null,all:all}}
function viewPra(){
 if(!P){return '<h2>Practicar</h2><div class="sub">Te muestro la frase en español y eliges cómo se dice en inglés. Cada acierto suma ⭐ 10.</div><button class="btn p" data-start="0">🎯 Practicar las 30 esenciales</button><button class="btn c" data-start="1">📖 Practicar todo el diccionario</button>'}
 if(P.done){const pc=Math.round(P.ok/P.qs.length*100);return '<div class="big">'+(pc>=80?"🏆":pc>=50?"💪":"📚")+'</div><h2 style="text-align:center">'+P.ok+' de '+P.qs.length+' correctas</h2><div class="sub" style="text-align:center">Ganaste ⭐ '+P.xp+'.'+(pc>=80?" ¡Excelente!":" Repite para mejorar.")+'</div><button class="btn p" data-start="'+(P.all?1:0)+'">Practicar otra vez</button><button class="btn c" data-start="x">Salir</button>'}
 const c=P.qs[P.i];let h='<div class="bar"><i style="width:'+(P.i/P.qs.length*100)+'%"></i></div><div class="qh">¿Cómo se dice en inglés?</div><div class="q">'+esc(c.p.es)+'</div><div style="height:12px"></div>';
 c.opts.forEach((o,k)=>{let cl="btn";if(P.sel!==null){if(o.id===c.p.id)cl+=" ok";else if(k===P.sel)cl+=" no"}h+='<button class="'+cl+'" data-ans="'+k+'"'+(P.sel!==null?" disabled":"")+'>'+esc(o.en)+'</button>'});
 if(P.sel!==null){const good=c.opts[P.sel].id===c.p.id;h+='<div class="sheet '+(good?"ok":"no")+'"><b>'+(good?"¡Correcto! +10":"Respuesta correcta:")+'</b><div>'+(good?esc(c.p.en):esc(c.p.en))+'<br><i style="color:var(--lime)">'+esc(c.p.pr)+'</i></div><button class="btn p" data-next="1" style="margin:0">CONTINUAR</button></div>'}
 return h}
function viewTra(){
 return '<h2>Traductor</h2><div class="sub">Escribe y traduce al instante. Necesita internet. Tip: usa el micrófono de tu teclado para dictar.</div><button class="btn c" id="dirb">'+(dir==="es|en"?"Español → Inglés":"Inglés → Español")+' ⇄</button><textarea id="tin" placeholder="'+(dir==="es|en"?"Escribe en español...":"Write in English...")+'"></textarea><div id="tout"></div><div id="tloc"></div>'}
function tranUI(){const o=$("#tout");if(!o)return;
 if(!lastTr){o.innerHTML="";return}
 if(lastTr.err){o.innerHTML='<div class="res" style="color:var(--mut)">'+esc(lastTr.err)+'</div>';return}
 o.innerHTML='<div class="res"><div class="en" id="trt"></div><div class="row" style="margin-top:12px"><button class="btn c" id="trs" style="margin:0">🔊 Escuchar</button><button class="btn p" id="trv" style="margin:0">♡ Guardar</button></div></div>';
 $("#trt").textContent=lastTr.text;
 $("#trs").onclick=()=>say(lastTr.text,dir==="es|en"?"en-US":"es-ES");
 $("#trv").onclick=()=>{const en=dir==="es|en"?lastTr.text:lastTr.src,es=dir==="es|en"?lastTr.src:lastTr.text;S.saved.push({en:en,es:es});lset("saved",S.saved);$("#trv").textContent="♥ Guardada";$("#trv").disabled=true}}
function localMatches(t){const n=norm(t);if(n.length<3){$("#tloc").innerHTML="";return}
 const m=ALL.filter(p=>norm(dir==="es|en"?p.es:p.en).includes(n)).slice(0,3);
 $("#tloc").innerHTML=m.length?'<div class="qh" style="margin:6px 2px 8px">Del diccionario (sin internet)</div>'+m.map(p=>card(p)).join(""):""}
function doTran(){const t=$("#tin").value.trim();const my=++tseq;localMatches(t);
 if(!t){lastTr=null;tranUI();return}
 fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(t)+"&langpair="+dir).then(r=>r.json()).then(j=>{if(my!==tseq)return;const x=j&&j.responseData&&j.responseData.translatedText;lastTr=x?{text:x,src:t}:{err:"No pude traducir esto. Intenta con otra frase."};tranUI()}).catch(()=>{if(my!==tseq)return;lastTr={err:"Sin conexión. Conéctate a internet para traducir. Mientras tanto, busca en el 📖 Diccionario."};tranUI()})}
function render(){
 [...document.querySelectorAll("#nav button")].forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
 const v=$("#view");const m={ess:viewEss,dic:viewDic,fav:viewFav,pra:viewPra,tra:viewTra}[tab];v.innerHTML=m();
 if(tab==="dic"){$("#qi").addEventListener("input",e=>{q=e.target.value;$("#dl").innerHTML=dicList()})}
 if(tab==="tra"){$("#dirb").onclick=()=>{dir=dir==="es|en"?"en|es":"es|en";lastTr=null;render()};$("#tin").addEventListener("input",()=>{clearTimeout(ttimer);ttimer=setTimeout(doTran,650)})}
 pills()}
function refreshKeep(){const v=$("#view"),st=v.scrollTop;const qi=$("#qi");const focus=qi&&document.activeElement===qi;render();v.scrollTop=st;if(focus){const n=$("#qi");n.focus()}}
document.addEventListener("click",e=>{
 const nv=e.target.closest("#nav button");if(nv){tab=nv.dataset.t;if(tab!=="pra")P=P&&!P.done?P:null;render();$("#view").scrollTop=0;return}
 const g=e.target.closest("[data-go]");if(g){tab=g.dataset.go;render();return}
 const sy=e.target.closest("[data-say]");if(sy){say(ALL[+sy.dataset.say].en);return}
 const st=e.target.closest("[data-sayt]");if(st){say(S.saved[+st.dataset.sayt].en);return}
 const lk=e.target.closest("[data-like]");if(lk){const i=lk.dataset.like;S.likes[i]=!S.likes[i];lset("likes",S.likes);refreshKeep();return}
 const ln=e.target.closest("[data-learn]");if(ln){const i=ln.dataset.learn;S.learned[i]=!S.learned[i];lset("learned",S.learned);if(S.learned[i])addXp(5);refreshKeep();return}
 const dl=e.target.closest("[data-del]");if(dl){S.saved.splice(+dl.dataset.del,1);lset("saved",S.saved);render();return}
 const ct=e.target.closest("[data-cat]");if(ct){cat=ct.dataset.cat;refreshKeep();return}
 const sp=e.target.closest("[data-start]");if(sp){const v=sp.dataset.start;if(v==="x")P=null;else newPractice(v==="1");render();return}
 const an=e.target.closest("[data-ans]");if(an&&P&&P.sel===null){const k=+an.dataset.ans,c=P.qs[P.i];P.sel=k;if(c.opts[k].id===c.p.id){P.ok++;P.xp+=10;addXp(10)}say(c.p.en);render();return}
 const nx=e.target.closest("[data-next]");if(nx&&P){P.sel=null;P.i++;if(P.i>=P.qs.length)P.done=true;render();return}
});
$("#zm").onclick=()=>{S.zoom=S.zoom>=1.4?.9:+(S.zoom+.15).toFixed(2);document.documentElement.style.setProperty("--z",S.zoom);lset("zoom",S.zoom)};
render();
</script></body></html>
