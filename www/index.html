.b{flex:1}

.es{color:var(--mut);font-size:calc(12.5px*var(--z,1));margin-top:3px}
.st{flex:none;background:none;border:0;color:#555;font-size:24px;padding:0 2px}
.st.on{color:var(--gold)}
footer{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}

.info{margin:16px 14px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--mut);line-height:1.5}

const VERSION="0.3";
let cat="Todas",favOnly=false,speak=true,zoom=1,favs={};
function ls(g,k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
try{favs=JSON.parse(ls(0,"fav")||"{}")}catch(e){favs={}}
zoom=parseFloat(ls(0,"zoom")||"1")||1;speak=ls(0,"voz")!=="0";
document.documentElement.style.setProperty("--z",zoom);
let n=0;DATA.forEach(c=>c.p.forEach(p=>p.id=++n));
const $=s=>document.querySelector(s);
const chips=$("#chips");
["Todas",...DATA.map(c=>c.c)].forEach(c=>{const b=document.createElement("button");b.className="chip";b.textContent=c;b.onclick=()=>{cat=c;favOnly=false;render()};chips.appendChild(b)});
function say(t){if(!speak||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function esc(s){return s.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}
function render(){
 const q=$("#q").value.trim().toLowerCase();
 [...chips.children].forEach(b=>b.classList.toggle("on",!favOnly&&b.textContent===cat));
 $("#fav").classList.toggle("on",favOnly);
 $("#vo").textContent="🔊 Voz: "+(speak?"ON":"OFF");
 let h="",cnt=0;
 DATA.forEach(c=>{
  if(!favOnly&&cat!=="Todas"&&c.c!==cat)return;
  const ps=c.p.filter(p=>(!favOnly||favs[p.id])&&(!q||(p.en+" "+p.es+" "+p.pr).toLowerCase().includes(q)));
  if(!ps.length)return;
  h+='<div class="sec">'+esc(c.c.toUpperCase())+'</div>';
  ps.forEach(p=>{cnt++;h+='<div class="card" data-id="'+p.id+'"><div class="n">'+p.id+'</div><div class="b"><div class="en">'+esc(p.en)+'</div><div class="pr">'+esc(p.pr)+'</div><div class="es">'+esc(p.es)+'</div></div><button class="st'+(favs[p.id]?" on":"")+'" data-s="'+p.id+'">'+(favs[p.id]?"★":"☆")+'</button></div>'});
 });
 $("#list").innerHTML=cnt?h:'<div class="empty">'+(favOnly?"Aún no tienes favoritas. Toca ☆ en una frase.":"Sin resultados.")+'</div>';
}
$("#list").addEventListener("click",e=>{
 const s=e.target.closest("[data-s]");
 if(s){const id=s.dataset.s;favs[id]?delete favs[id]:favs[id]=1;ls(0,"fav",JSON.stringify(favs));render();return}
 const c=e.target.closest(".card");
 if(c){const id=+c.dataset.id;let f;DATA.forEach(x=>x.p.forEach(p=>{if(p.id===id)f=p}));say(f.en)}
});
$("#q").addEventListener("input",render);
$("#fav").onclick=()=>{favOnly=!favOnly;render()};
$("#zm").onclick=()=>{zoom=zoom>=1.4?.9:+(zoom+.15).toFixed(2);document.documentElement.style.setProperty("--z",zoom);ls(0,"zoom",String(zoom))};
$("#vo").onclick=()=>{speak=!speak;ls(0,"voz",speak?"1":"0");render()};
$("#inf").onclick=()=>{
 $("#list").innerHTML='<div class="info"><b>Frases Entrenador v'+VERSION+'</b><br>200 frases en inglés para entrenamiento personalizado: anamnesis, resultados, ejercicios, descanso, motivación, cierre y paquete.<br><br><b>Cómo usarla</b><br>• Toca una frase para escucharla en inglés (si tu teléfono tiene voz en inglés).<br>• ☆ guarda tus favoritas.<br>• "Aa Tamaño" agranda o reduce el texto.<br>• Funciona sin internet.<br><br>Pronunciación en lima: aproximada, en español.<br><br><b>Versiones</b><br>v0.3: 200 frases, 13 categorías, buscador, favoritas y voz.<br>v0.2/v0.1: lista inicial de 70 frases (PDF).</div>';
 [...chips.children].forEach(b=>b.classList.remove("on"));
};
render();
